<!doctype html><html><head><meta charset="utf-8"><title>loading</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Roboto+Slab:wght@500;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1800px;height:660px;background:#16161a;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;display:flex;gap:16px;padding:16px;overflow:hidden}
.col{flex:1;position:relative;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tag{position:absolute;top:-1px;left:-1px;font:700 13px 'Barlow Condensed';padding:2px 9px;z-index:3}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 6px 34px;margin-top:2px}
.panel{position:relative;padding:10px 12px 11px}
.h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:14px}
.num{line-height:1}
.small{font-size:13px;line-height:1.35}
.small b{font-weight:600}
.kv{width:150px;display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:13px}
.kv span:nth-child(odd){opacity:.7}.kv span:nth-child(even){text-align:right;font-weight:600}
svg{display:block;flex:none}
.bar{height:10px;display:flex;gap:2px;margin:8px 0 6px}
.bar i{display:block;height:100%}
/* A */
.A{background:linear-gradient(#08142c,#02050d);color:#cfeaf5;font-family:'Barlow Condensed';border:1px solid #1d4a63;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.A::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 3px,#6fd8ff08 3px 4px);pointer-events:none;z-index:2}
.A .tag{left:16px;background:#ffb02e;color:#02050d}
.A .top{border-bottom:1px solid #35b8e0;font-size:19px;font-weight:600;letter-spacing:.14em;color:#6fd8ff}
.A .top em{font-style:normal;font-size:13px;color:#ffb02e;letter-spacing:.1em}
.A .panel{border:1px solid #1f6a8c;background:#061226;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.A .h{font-size:15px;font-weight:600;letter-spacing:.12em;color:#6fd8ff}
.A .h i{width:10px;height:10px;background:#ffb02e;transform:rotate(45deg);display:block}
.A .h u{flex:1;height:1px;background:#1f6a8c}
.A .num{font-size:46px;font-weight:600;color:#ffb02e}
.A .small{font-family:Barlow;color:#9fc4d4}
.A .kv{font-family:Barlow}
/* B */
.B{background:#0d0d0e;color:#d9dce0;font-family:'Barlow';border:1px solid #3a3c40}
.B .tag{background:#c4231f;color:#fff;letter-spacing:.2em}
.B .top{border-bottom:1px solid #4a4d52;font:500 14px 'Barlow';letter-spacing:.42em;color:#eceef0;padding-left:40px}
.B .top em{font-style:normal;font-size:11px;letter-spacing:.3em;color:#c4231f}
.B .panel{border:1px solid #34363a;background:#141416;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:20px 20px}
.B .h{font:600 12px 'Barlow';letter-spacing:.36em;color:#eceef0}
.B .h i{width:3px;height:14px;background:#c4231f;display:block}
.B .h u{flex:1;height:1px;background:#3a3c40}
.B .num{font:400 44px 'Oswald';letter-spacing:.06em;color:#e0302b}
.B .small{color:#a4a8ae;letter-spacing:.08em;font-size:12px}
.B .kv{letter-spacing:.1em;font-size:12px}
/* C */
.C{background:radial-gradient(#2a1c12,#140c07);color:#f1e3c4;font-family:'Roboto Slab';border:3px solid #3a2616;border-radius:26px}
.C .tag{background:#f1e3c4;color:#140c07;border-radius:22px 0 10px 0;left:0;top:0}
.C .top{background:#1d1109;border:2px solid #4a3220;border-radius:30px;font:600 17px 'Roboto Slab';letter-spacing:.06em;padding-left:48px;color:#f1e3c4}
.C .top span.ind{display:flex;gap:6px}
.C .top i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid #0006}
.C .panel{background:#1d1109;border:2px solid #4a3220;border-radius:22px;box-shadow:inset 0 2px 0 #ffffff10,inset 0 -3px 6px #0007}
.C .h{font:600 14px 'Roboto Slab';letter-spacing:.04em;color:#f1e3c4}
.C .h i{width:13px;height:13px;border-radius:50%;display:block;border:1px solid #0008}
.C .h u{flex:1;height:2px;background:#4a3220;border-radius:2px}
.C .num{font:700 40px 'Roboto Slab'}
.C .small{color:#cdb894;font-size:13px}
.C .kv{color:#f1e3c4}
</style></head><body>
<div class="col A"><div class="tag">A · REBEL CONSOLE</div><div class="top"><span>AMS GARMIN · BRIDGE</span><em>SYS 09 NOV</em></div></div>
<div class="col B"><div class="tag">B · IMPERIAL BRIDGE</div><div class="top"><span>AMS GARMIN · BRIDGE</span><em>09.11</em></div></div>
<div class="col C"><div class="tag">C · FALCON COCKPIT</div><div class="top"><span>AMS GARMIN · BRIDGE</span><span class="ind"><i style="background:#d8452f"></i><i style="background:#f0a830"></i><i style="background:#4a8fd6"></i><i style="background:#6cbf5a"></i></span></div></div>
<script>
const T={
A:{c:'#ffb02e',c2:'#6fd8ff',c3:'#6fd8ff',track:'#12324a',ink:'#cfeaf5',tick:'#35b8e0',font:'Barlow Condensed',steps:'#ffb02e',heart:'#6fd8ff',sleep:'#ffb02e'},
B:{track:'#2a2c30',ink:'#d9dce0',tick:'#5a5d62',font:'Oswald',steps:'#e0302b',heart:'#e0302b',sleep:'#e0302b'},
C:{track:'#3a2616',ink:'#f1e3c4',tick:'#8a6a48',font:'Roboto Slab',steps:'#f0a830',heart:'#d8452f',sleep:'#6cbf5a'}};
function pt(cx,cy,r,a){a=a*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arc(cx,cy,r,a0,a1){const[x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`}
function gauge(k){const t=T[k],col=t.steps,cap=k=='B'?'butt':k=='C'?'round':'butt';
 let s=`<svg width="104" height="104" viewBox="0 0 104 104">`;
 if(k=='A'){s+=`<path d="M10 2H94L102 10V94L94 102H10L2 94V10Z" fill="none" stroke="#1f6a8c"/>`}
 if(k=='B'){s+=`<rect x="2.5" y="2.5" width="99" height="99" fill="none" stroke="#3a3c40"/>`}
 if(k=='C'){s+=`<circle cx="52" cy="52" r="50" fill="#0f0804" stroke="#5a3d26" stroke-width="3"/>`}
 const sw=k=='B'?6:k=='C'?9:8;
 s+=`<path d="${arc(52,52,36,-90,269.9)}" fill="none" stroke="${t.track}" stroke-width="${sw}"/>`;
 s+=`<path d="${arc(52,52,36,-90,-90+360*.23)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="${cap}"/>`;
 for(let i=0;i<24;i++){const[a,b]=pt(52,52,k=='C'?27:28,i*15),[c,d]=pt(52,52,k=='C'?23:24,i*15);s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${t.tick}" stroke-width="1"/>`}
 s+=`<text x="52" y="57" text-anchor="middle" font-family="${t.font}" font-size="${k=='B'?19:21}" fill="${t.ink}" ${k=='B'?'letter-spacing="1.5"':''}>23%</text></svg>`;return s}
function dial(k){const t=T[k],col=t.heart,sw=k=='B'?5:k=='C'?8:7;
 const v=(45-30)/(120-30),ang=180+180*v;
 let s=`<svg width="124" height="82" viewBox="0 0 124 82">`;
 if(k=='C')s+=`<circle cx="62" cy="62" r="60" fill="#0f0804" stroke="#5a3d26" stroke-width="3"/>`;
 s+=`<path d="${arc(62,62,46,180,360)}" fill="none" stroke="${t.track}" stroke-width="${sw}"/>`;
 s+=`<path d="${arc(62,62,46,180,180+180*(83-30)/90)}" fill="none" stroke="${k=='A'?'#1f6a8c':k=='B'?'#4a4d52':'#6a4a2e'}" stroke-width="${sw}"/>`;
 s+=`<path d="${arc(62,62,46,180,ang)}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
 for(let i=0;i<=18;i++){const a=180+i*10,l=i%3?4:8,[x0,y0]=pt(62,62,36,a),[x1,y1]=pt(62,62,36-l,a);s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${t.tick}"/>`}
 const[nx,ny]=pt(62,62,40,ang);
 s+=`<line x1="62" y1="62" x2="${nx}" y2="${ny}" stroke="${t.ink}" stroke-width="${k=='C'?3:2}" stroke-linecap="${k=='C'?'round':'butt'}"/><circle cx="62" cy="62" r="${k=='C'?6:4}" fill="${k=='A'?'#ffb02e':k=='B'?'#c4231f':'#d8452f'}"/>`;
 s+=`<text x="12" y="78" font-size="10" fill="${t.ink}" opacity=".7" font-family="sans-serif">30</text><text x="100" y="78" font-size="10" fill="${t.ink}" opacity=".7" font-family="sans-serif">120</text></svg>`;return s}
function sleepbar(k){const cs={A:['#12324a','#1f6a8c','#6fd8ff','#ffb02e'],B:['#2a2c30','#4a4d52','#8a8d92','#e0302b'],C:['#3a2616','#6a4a2e','#4a8fd6','#6cbf5a']}[k];
 const w=[8,38,34,12,8];const c=[cs[0],cs[1],cs[2],cs[3],cs[0]];return `<div class="bar" style="${k=='C'?'border-radius:6px;overflow:hidden':''}">`+w.map((x,i)=>`<i style="width:${x}%;background:${c[i]}"></i>`).join('')+`</div>`}
function dot(k,c){return `<i style="background:${c}"></i>`}
function panels(k){const t=T[k];const hc=k=='C'?['#f0a830','#d8452f','#6cbf5a']:['',' ',''];
 const hd=(n,i)=>`<div class="h">${k=='C'?dot(k,hc[i]):'<i></i>'}<span>${n}</span><u></u></div>`;
 const nc=(c)=>`style="color:${c}"`;
 return `
<div class="panel">${hd('STEPS · TODAY',0)}<div class="row">${gauge(k)}<div><div class="num" ${nc(t.steps)}>3 408</div><div class="small" style="margin:5px 0 4px">steps · 23 % of goal 14 830</div><div class="small"><b>2.9 km</b> distance</div></div></div></div>
<div class="panel">${hd('CARDIO · TODAY',1)}<div class="row">${dial(k)}<div><div class="num" ${nc(t.heart)}>45 <span style="font-size:.4em;letter-spacing:.05em">bpm</span></div><div class="small" style="margin:4px 0 5px">resting</div><div class="kv"><span>Min</span><span>42</span><span>Max</span><span>83</span><span>Month avg</span><span>51</span></div></div></div></div>
<div class="panel">${hd('SLEEP · LAST NIGHT',2)}<div class="row" style="align-items:flex-end;justify-content:space-between"><div class="num" ${nc(t.sleep)}>7 h 12 min</div><div class="num" style="font-size:22px;color:${t.ink}">${k=='B'?'GOOD':'Good'}</div></div>${sleepbar(k)}<div class="row small" style="justify-content:space-between"><span>bed <b>23:10</b></span><span>up <b>06:22</b></span></div></div>`}
['A','B','C'].forEach(k=>document.querySelector('.col.'+k).insertAdjacentHTML('beforeend',panels(k)));
document.fonts.ready.then(()=>{document.title='ready'});
</script></body></html>
